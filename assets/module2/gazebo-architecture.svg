<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="350" xmlns="http://www.w3.org/2000/svg">
  <title>Gazebo Simulation Architecture</title>
  <desc>Diagram showing the architecture of Gazebo simulation with physics engine, sensors, and ROS 2 integration</desc>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="18" text-anchor="middle" fill="#000000">Gazebo Simulation Architecture</text>

  <!-- Gazebo Core -->
  <g transform="translate(200, 60)">
    <rect x="0" y="0" width="200" height="80" fill="#2196F3" stroke="#0D47A1" stroke-width="2" rx="10"/>
    <text x="100" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">Gazebo Simulation Core</text>
    <text x="100" y="55" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">(Physics, Rendering, Sensors)</text>
  </g>

  <!-- Physics Engine -->
  <g transform="translate(50, 180)">
    <rect x="0" y="0" width="120" height="60" fill="#4CAF50" stroke="#2E7D32" stroke-width="2" rx="5"/>
    <text x="60" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Physics Engine</text>
    <text x="60" y="40" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">(ODE, Bullet, Simbody)</text>
  </g>

  <!-- Sensor System -->
  <g transform="translate(240, 180)">
    <rect x="0" y="0" width="120" height="60" fill="#FF9800" stroke="#E65100" stroke-width="2" rx="5"/>
    <text x="60" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Sensor System</text>
    <text x="60" y="40" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">(Cameras, LiDAR, IMU)</text>
  </g>

  <!-- Rendering Engine -->
  <g transform="translate(430, 180)">
    <rect x="0" y="0" width="120" height="60" fill="#9C27B0" stroke="#4A148C" stroke-width="2" rx="5"/>
    <text x="60" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Rendering Engine</text>
    <text x="60" y="40" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">(OGRE, OpenGL)</text>
  </g>

  <!-- ROS 2 Interface -->
  <g transform="translate(200, 280)">
    <rect x="0" y="0" width="200" height="40" fill="#F44336" stroke="#B71C1C" stroke-width="2" rx="5"/>
    <text x="100" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">ROS 2 Interface (ros_gz)</text>
  </g>

  <!-- Connection arrows -->
  <line x1="300" y1="140" x2="110" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="140" x2="300" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="140" x2="490" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <line x1="110" y1="240" x2="300" y2="280" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="240" x2="300" y2="280" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="490" y1="240" x2="300" y2="280" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <line x1="300" y1="320" x2="300" y2="340" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

  <!-- External connection -->
  <g transform="translate(250, 340)">
    <rect x="0" y="0" width="100" height="30" fill="#8BC34A" stroke="#558B2F" stroke-width="2" rx="5"/>
    <text x="50" y="20" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">ROS 2 Nodes</text>
  </g>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>

  <!-- Labels -->
  <text x="80" y="170" font-family="Arial" font-size="10" text-anchor="middle" fill="#000000">Physics</text>
  <text x="300" y="170" font-family="Arial" font-size="10" text-anchor="middle" fill="#000000">Sensors</text>
  <text x="510" y="170" font-family="Arial" font-size="10" text-anchor="middle" fill="#000000">Rendering</text>
  <text x="350" y="335" font-family="Arial" font-size="10" text-anchor="middle" fill="#000000">ROS 2 Interface</text>

  <!-- Legend -->
  <rect x="20" y="330" width="180" height="40" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="30" y="345" font-family="Arial" font-size="12" fill="#000000">Legend:</text>
  <rect x="30" y="355" width="15" height="10" fill="#2196F3" stroke="#0D47A1"/>
  <text x="50" y="365" font-family="Arial" font-size="10" fill="#000000">Gazebo Core</text>
  <rect x="110" y="355" width="15" height="10" fill="#4CAF50" stroke="#2E7D32"/>
  <text x="130" y="365" font-family="Arial" font-size="10" fill="#000000">Physics</text>
</svg>