<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <title>Humanoid Robot Control Architecture</title>
  <desc>Diagram showing the control architecture for humanoid robotics systems</desc>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" fill="#000000">Humanoid Robot Control Architecture</text>

  <!-- High-Level Planner -->
  <g transform="translate(400, 80)">
    <rect x="-150" y="0" width="300" height="60" fill="#2196F3" stroke="#0D47A1" stroke-width="2" rx="10"/>
    <text x="0" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">High-Level Planner</text>
    <text x="0" y="45" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">(Task Planning, Reasoning)</text>
  </g>

  <!-- Behavior Layer -->
  <g transform="translate(400, 180)">
    <rect x="-150" y="0" width="300" height="60" fill="#FF9800" stroke="#E65100" stroke-width="2" rx="10"/>
    <text x="0" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">Behavior Layer</text>
    <text x="0" y="45" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">(Navigation, Manipulation, Interaction)</text>
  </g>

  <!-- Motion Planning -->
  <g transform="translate(200, 280)">
    <rect x="0" y="0" width="180" height="50" fill="#4CAF50" stroke="#2E7D32" stroke-width="2" rx="5"/>
    <text x="90" y="20" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Motion Planning</text>
    <text x="90" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">(Path, Trajectory)</text>
  </g>

  <!-- Whole-Body Controller -->
  <g transform="translate(400, 280)">
    <rect x="-90" y="0" width="180" height="50" fill="#9C27B0" stroke="#4A148C" stroke-width="2" rx="5"/>
    <text x="0" y="20" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Whole-Body Controller</text>
    <text x="0" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">(Balance, Coordination)</text>
  </g>

  <!-- Task Space Controller -->
  <g transform="translate(600, 280)">
    <rect x="-90" y="0" width="180" height="50" fill="#F44336" stroke="#B71C1C" stroke-width="2" rx="5"/>
    <text x="0" y="20" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Task Space Controller</text>
    <text x="0" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">(End-Effector Control)</text>
  </g>

  <!-- Joint Controllers -->
  <g transform="translate(250, 370)">
    <rect x="0" y="0" width="120" height="40" fill="#3F51B5" stroke="#1A237E" stroke-width="2" rx="5"/>
    <text x="60" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Joint Controllers</text>
  </g>

  <g transform="translate(400, 370)">
    <rect x="0" y="0" width="120" height="40" fill="#3F51B5" stroke="#1A237E" stroke-width="2" rx="5"/>
    <text x="60" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Joint Controllers</text>
  </g>

  <g transform="translate(550, 370)">
    <rect x="0" y="0" width="120" height="40" fill="#3F51B5" stroke="#1A237E" stroke-width="2" rx="5"/>
    <text x="60" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Joint Controllers</text>
  </g>

  <!-- Hardware Abstraction Layer -->
  <g transform="translate(400, 450)">
    <rect x="-200" y="0" width="400" height="50" fill="#795548" stroke="#3E2723" stroke-width="2" rx="10"/>
    <text x="0" y="20" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Hardware Abstraction Layer</text>
    <text x="0" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">(ROS 2, CAN, EtherCAT, etc.)</text>
  </g>

  <!-- Physical Robot -->
  <g transform="translate(400, 550)">
    <!-- Head -->
    <circle cx="0" cy="0" r="25" fill="#8BC34A" stroke="#558B2F" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">Head</text>

    <!-- Body -->
    <rect x="-20" y="25" width="40" height="60" fill="#8BC34A" stroke="#558B2F" stroke-width="2"/>
    <text x="0" y="55" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">Body</text>

    <!-- Arms -->
    <line x1="-20" y1="35" x2="-45" y2="35" stroke="#8BC34A" stroke-width="8" stroke-linecap="round"/>
    <line x1="20" y1="35" x2="45" y2="35" stroke="#8BC34A" stroke-width="8" stroke-linecap="round"/>

    <!-- Legs -->
    <line x1="-12" y1="85" x2="-12" y2="120" stroke="#8BC34A" stroke-width="8" stroke-linecap="round"/>
    <line x1="12" y1="85" x2="12" y2="120" stroke="#8BC34A" stroke-width="8" stroke-linecap="round"/>

    <!-- Joint markers -->
    <circle cx="-45" cy="35" r="5" fill="#FF5722"/>
    <circle cx="45" cy="35" r="5" fill="#FF5722"/>
    <circle cx="-12" cy="85" r="5" fill="#FF5722"/>
    <circle cx="12" cy="85" r="5" fill="#FF5722"/>
  </g>

  <!-- Sensors -->
  <g transform="translate(150, 500)">
    <rect x="0" y="0" width="100" height="30" fill="#FFEB3B" stroke="#F57F17" stroke-width="2" rx="5"/>
    <text x="50" y="20" font-family="Arial" font-size="10" text-anchor="middle" fill="#000000">Sensors</text>
  </g>

  <g transform="translate(550, 500)">
    <rect x="0" y="0" width="100" height="30" fill="#FFEB3B" stroke="#F57F17" stroke-width="2" rx="5"/>
    <text x="50" y="20" font-family="Arial" font-size="10" text-anchor="middle" fill="#000000">Actuators</text>
  </g>

  <!-- Connection arrows -->
  <line x1="400" y1="140" x2="400" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <line x1="320" y1="240" x2="290" y2="280" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="240" x2="400" y2="280" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="480" y1="240" x2="510" y2="280" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <line x1="290" y1="330" x2="310" y2="370" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="330" x2="400" y2="370" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="510" y1="330" x2="490" y2="370" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <line x1="310" y1="410" x2="200" y2="450" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="410" x2="400" y2="450" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="490" y1="410" x2="600" y2="450" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <line x1="200" y1="500" x2="250" y2="550" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="500" x2="550" y2="550" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

  <line x1="400" y1="500" x2="400" y2="550" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Feedback arrows -->
  <line x1="180" y1="570" x2="180" y2="520" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="180" y1="520" x2="150" y2="520" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

  <line x1="620" y1="570" x2="620" y2="520" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="620" y1="520" x2="650" y2="520" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

  <line x1="650" y1="520" x2="650" y2="480" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="650" y1="480" x2="600" y2="480" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>

  <!-- Labels -->
  <text x="420" y="170" font-family="Arial" font-size="10" text-anchor="start" fill="#000000">Task Commands</text>
  <text x="340" y="270" font-family="Arial" font-size="10" text-anchor="start" fill="#000000">Motion Plan</text>
  <text x="420" y="270" font-family="Arial" font-size="10" text-anchor="start" fill="#000000">Balance Commands</text>
  <text x="520" y="270" font-family="Arial" font-size="10" text-anchor="start" fill="#000000">Task Commands</text>
  <text x="320" y="360" font-family="Arial" font-size="10" text-anchor="start" fill="#000000">Joint Trajectories</text>
  <text x="420" y="360" font-family="Arial" font-size="10" text-anchor="start" fill="#000000">Balance Commands</text>
  <text x="500" y="360" font-family="Arial" font-size="10" text-anchor="start" fill="#000000">Task Commands</text>
  <text x="420" y="440" font-family="Arial" font-size="10" text-anchor="start" fill="#000000">Control Commands</text>
  <text x="250" y="540" font-family="Arial" font-size="10" text-anchor="start" fill="#000000">Sensor Data</text>
  <text x="550" y="540" font-family="Arial" font-size="10" text-anchor="start" fill="#000000">Actuator Commands</text>

  <!-- Legend -->
  <rect x="20" y="630" width="350" height="60" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="30" y="645" font-family="Arial" font-size="12" fill="#000000">Legend:</text>
  <rect x="30" y="655" width="15" height="10" fill="#2196F3" stroke="#0D47A1"/>
  <text x="50" y="665" font-family="Arial" font-size="10" fill="#000000">Planning</text>
  <rect x="30" y="670" width="15" height="10" fill="#FF9800" stroke="#E65100"/>
  <text x="50" y="680" font-family="Arial" font-size="10" fill="#000000">Behavior</text>
  <rect x="130" y="655" width="15" height="10" fill="#4CAF50" stroke="#2E7D32"/>
  <text x="150" y="665" font-family="Arial" font-size="10" fill="#000000">Motion</text>
  <rect x="130" y="670" width="15" height="10" fill="#9C27B0" stroke="#4A148C"/>
  <text x="150" y="680" font-family="Arial" font-size="10" fill="#000000">Control</text>
  <rect x="230" y="655" width="15" height="10" fill="#3F51B5" stroke="#1A237E"/>
  <text x="250" y="665" font-family="Arial" font-size="10" fill="#000000">Joint</text>
  <rect x="230" y="670" width="15" height="10" fill="#795548" stroke="#3E2723"/>
  <text x="250" y="680" font-family="Arial" font-size="10" fill="#000000">Hardware</text>
</svg>