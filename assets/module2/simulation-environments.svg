<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <title>Simulation Environments: Gazebo and Unity</title>
  <desc>Diagram showing the relationship between real robots, Gazebo simulation, Unity simulation, and digital twin concepts</desc>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="18" text-anchor="middle" fill="#000000">Simulation Environments: Gazebo and Unity</text>

  <!-- Real Robot -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="120" height="80" fill="#4CAF50" stroke="#2E7D32" stroke-width="2" rx="5"/>
    <text x="60" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">Real Robot</text>
    <text x="60" y="55" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">(Physical)</text>
  </g>

  <!-- Gazebo Simulation -->
  <g transform="translate(240, 60)">
    <rect x="0" y="0" width="120" height="80" fill="#2196F3" stroke="#0D47A1" stroke-width="2" rx="5"/>
    <text x="60" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">Gazebo</text>
    <text x="60" y="55" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Simulation</text>
  </g>

  <!-- Unity Simulation -->
  <g transform="translate(430, 60)">
    <rect x="0" y="0" width="120" height="80" fill="#FF9800" stroke="#E65100" stroke-width="2" rx="5"/>
    <text x="60" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">Unity</text>
    <text x="60" y="55" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Simulation</text>
  </g>

  <!-- Digital Twin -->
  <g transform="translate(240, 200)">
    <rect x="0" y="0" width="120" height="80" fill="#9C27B0" stroke="#4A148C" stroke-width="2" rx="5"/>
    <text x="60" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">Digital</text>
    <text x="60" y="55" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Twin</text>
  </g>

  <!-- Real World Environment -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="120" height="80" fill="#8BC34A" stroke="#558B2F" stroke-width="2" rx="5"/>
    <text x="60" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">Real</text>
    <text x="60" y="55" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Environment</text>
  </g>

  <!-- Simulation Environment -->
  <g transform="translate(430, 200)">
    <rect x="0" y="0" width="120" height="80" fill="#FFD54F" stroke="#F57F17" stroke-width="2" rx="5"/>
    <text x="60" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Virtual</text>
    <text x="60" y="55" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Environment</text>
  </g>

  <!-- Connection arrows -->
  <line x1="170" y1="120" x2="240" y2="100" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="170" y1="120" x2="430" y2="100" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

  <line x1="170" y1="240" x2="240" y2="240" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="170" y1="240" x2="430" y2="240" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

  <line x1="300" y1="140" x2="300" y2="200" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="490" y1="140" x2="490" y2="200" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

  <line x1="300" y1="280" x2="240" y2="240" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="490" y1="280" x2="430" y2="240" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>

  <!-- Labels -->
  <text x="180" y="80" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Simulate</text>
  <text x="180" y="220" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Replicate</text>
  <text x="360" y="180" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Sync</text>
  <text x="550" y="180" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Sync</text>
  <text x="360" y="300" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Feedback</text>
  <text x="550" y="300" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Feedback</text>

  <!-- Legend -->
  <rect x="20" y="330" width="250" height="60" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="30" y="345" font-family="Arial" font-size="12" fill="#000000">Legend:</text>
  <rect x="30" y="355" width="15" height="10" fill="#4CAF50" stroke="#2E7D32"/>
  <text x="50" y="365" font-family="Arial" font-size="10" fill="#000000">Real Robot</text>
  <rect x="30" y="370" width="15" height="10" fill="#2196F3" stroke="#0D47A1"/>
  <text x="50" y="380" font-family="Arial" font-size="10" fill="#000000">Gazebo</text>
  <rect x="120" y="355" width="15" height="10" fill="#FF9800" stroke="#E65100"/>
  <text x="140" y="365" font-family="Arial" font-size="10" fill="#000000">Unity</text>
  <rect x="120" y="370" width="15" height="10" fill="#9C27B0" stroke="#4A148C"/>
  <text x="140" y="380" font-family="Arial" font-size="10" fill="#000000">Digital Twin</text>
</svg>