<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <title>Vision-Language-Action System Architecture</title>
  <desc>Diagram showing the Vision-Language-Action system for humanoid robotics</desc>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" fill="#000000">Vision-Language-Action System Architecture</text>

  <!-- Humanoid Robot -->
  <g transform="translate(400, 100)">
    <!-- Head -->
    <circle cx="0" cy="0" r="30" fill="#8BC34A" stroke="#558B2F" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Head</text>

    <!-- Body -->
    <rect x="-25" y="30" width="50" height="80" fill="#8BC34A" stroke="#558B2F" stroke-width="2"/>
    <text x="0" y="75" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Body</text>

    <!-- Arms -->
    <line x1="-25" y1="40" x2="-60" y2="40" stroke="#8BC34A" stroke-width="10" stroke-linecap="round"/>
    <line x1="25" y1="40" x2="60" y2="40" stroke="#8BC34A" stroke-width="10" stroke-linecap="round"/>

    <!-- Legs -->
    <line x1="-15" y1="110" x2="-15" y2="160" stroke="#8BC34A" stroke-width="10" stroke-linecap="round"/>
    <line x1="15" y1="110" x2="15" y2="160" stroke="#8BC34A" stroke-width="10" stroke-linecap="round"/>

    <!-- Camera eyes -->
    <circle cx="-10" cy="-5" r="5" fill="#ffffff"/>
    <circle cx="10" cy="-5" r="5" fill="#ffffff"/>
    <circle cx="-10" cy="-5" r="2" fill="#000000"/>
    <circle cx="10" cy="-5" r="2" fill="#000000"/>
  </g>

  <!-- Voice Input -->
  <g transform="translate(100, 200)">
    <rect x="0" y="0" width="120" height="50" fill="#2196F3" stroke="#0D47A1" stroke-width="2" rx="5"/>
    <text x="60" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Voice Input</text>
    <text x="60" y="40" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">(Speech Recognition)</text>
  </g>

  <!-- Language Processing -->
  <g transform="translate(300, 200)">
    <rect x="0" y="0" width="200" height="50" fill="#FF9800" stroke="#E65100" stroke-width="2" rx="5"/>
    <text x="100" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Language Processing</text>
    <text x="100" y="40" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">(NLP, Intent Recognition)</text>
  </g>

  <!-- Vision Processing -->
  <g transform="translate(600, 200)">
    <rect x="0" y="0" width="150" height="50" fill="#4CAF50" stroke="#2E7D32" stroke-width="2" rx="5"/>
    <text x="75" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Vision Processing</text>
    <text x="75" y="40" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">(Object Detection)</text>
  </g>

  <!-- Planning Module -->
  <g transform="translate(300, 300)">
    <rect x="0" y="0" width="200" height="50" fill="#9C27B0" stroke="#4A148C" stroke-width="2" rx="5"/>
    <text x="100" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Planning Module</text>
    <text x="100" y="40" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">(Task & Motion Planning)</text>
  </g>

  <!-- Action Execution -->
  <g transform="translate(300, 400)">
    <rect x="0" y="0" width="200" height="50" fill="#F44336" stroke="#B71C1C" stroke-width="2" rx="5"/>
    <text x="100" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Action Execution</text>
    <text x="100" y="40" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">(Navigation & Manipulation)</text>
  </g>

  <!-- Environment -->
  <g transform="translate(600, 400)">
    <rect x="0" y="0" width="150" height="50" fill="#FFD54F" stroke="#F57F17" stroke-width="2" rx="5"/>
    <text x="75" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Environment</text>
    <text x="75" y="40" font-family="Arial" font-size="10" text-anchor="middle" fill="#000000">(Real/Simulated)</text>
  </g>

  <!-- Connection arrows -->
  <line x1="220" y1="225" x2="300" y2="225" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="225" x2="600" y2="225" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <line x1="400" y1="250" x2="400" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="350" x2="400" y2="400" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="425" x2="500" y2="425" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Feedback loops -->
  <line x1="400" y1="450" x2="400" y2="500" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="500" x2="160" y2="500" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="160" y1="500" x2="160" y2="250" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="160" y1="250" x2="220" y2="250" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>

  <!-- Labels -->
  <text x="260" y="215" font-family="Arial" font-size="10" text-anchor="middle" fill="#000000">Speech → Text</text>
  <text x="550" y="215" font-family="Arial" font-size="10" text-anchor="middle" fill="#000000">Visual Input</text>
  <text x="420" y="290" font-family="Arial" font-size="10" text-anchor="start" fill="#000000">Intent & Context</text>
  <text x="420" y="390" font-family="Arial" font-size="10" text-anchor="start" fill="#000000">Action Plan</text>
  <text x="540" y="415" font-family="Arial" font-size="10" text-anchor="start" fill="#000000">Perception Feedback</text>
  <text x="300" y="520" font-family="Arial" font-size="10" text-anchor="middle" fill="#000000">Learning & Adaptation</text>

  <!-- Legend -->
  <rect x="20" y="530" width="300" height="60" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="30" y="545" font-family="Arial" font-size="12" fill="#000000">Legend:</text>
  <rect x="30" y="555" width="15" height="10" fill="#2196F3" stroke="#0D47A1"/>
  <text x="50" y="565" font-family="Arial" font-size="10" fill="#000000">Language</text>
  <rect x="30" y="570" width="15" height="10" fill="#4CAF50" stroke="#2E7D32"/>
  <text x="50" y="580" font-family="Arial" font-size="10" fill="#000000">Vision</text>
  <rect x="130" y="555" width="15" height="10" fill="#9C27B0" stroke="#4A148C"/>
  <text x="150" y="565" font-family="Arial" font-size="10" fill="#000000">Planning</text>
  <rect x="130" y="570" width="15" height="10" fill="#F44336" stroke="#B71C1C"/>
  <text x="150" y="580" font-family="Arial" font-size="10" fill="#000000">Action</text>
  <rect x="230" y="555" width="15" height="10" fill="#8BC34A" stroke="#558B2F"/>
  <text x="250" y="565" font-family="Arial" font-size="10" fill="#000000">Humanoid</text>
</svg>