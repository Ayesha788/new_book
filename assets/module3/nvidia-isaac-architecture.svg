<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="400" xmlns="http://www.w3.org/2000/svg">
  <title>NVIDIA Isaac Platform Architecture</title>
  <desc>Diagram showing the architecture of NVIDIA Isaac platform for AI-powered robotics</desc>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title -->
  <text x="350" y="30" font-family="Arial" font-size="18" text-anchor="middle" fill="#000000">NVIDIA Isaac Platform Architecture</text>

  <!-- Hardware Layer -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="600" height="50" fill="#4CAF50" stroke="#2E7D32" stroke-width="2" rx="5"/>
    <text x="300" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">Hardware Layer</text>
  </g>

  <!-- Jetson Modules -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="100" height="30" fill="#2196F3" stroke="#0D47A1" stroke-width="2" rx="3"/>
    <text x="50" y="20" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">Jetson AGX</text>
  </g>

  <g transform="translate(200, 70)">
    <rect x="0" y="0" width="100" height="30" fill="#2196F3" stroke="#0D47A1" stroke-width="2" rx="3"/>
    <text x="50" y="20" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">Jetson Orin</text>
  </g>

  <g transform="translate(320, 70)">
    <rect x="0" y="0" width="100" height="30" fill="#2196F3" stroke="#0D47A1" stroke-width="2" rx="3"/>
    <text x="50" y="20" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">Jetson Nano</text>
  </g>

  <g transform="translate(440, 70)">
    <rect x="0" y="0" width="100" height="30" fill="#2196F3" stroke="#0D47A1" stroke-width="2" rx="3"/>
    <text x="50" y="20" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">x86 + GPU</text>
  </g>

  <!-- Isaac ROS -->
  <g transform="translate(50, 140)">
    <rect x="0" y="0" width="600" height="50" fill="#FF9800" stroke="#E65100" stroke-width="2" rx="5"/>
    <text x="300" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">Isaac ROS (Hardware Accelerated)</text>
  </g>

  <!-- Isaac ROS Components -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="80" height="30" fill="#9C27B0" stroke="#4A148C" stroke-width="2" rx="3"/>
    <text x="40" y="20" font-family="Arial" font-size="9" text-anchor="middle" fill="#ffffff">DNN</text>
  </g>

  <g transform="translate(200, 150)">
    <rect x="0" y="0" width="80" height="30" fill="#9C27B0" stroke="#4A148C" stroke-width="2" rx="3"/>
    <text x="40" y="20" font-family="Arial" font-size="9" text-anchor="middle" fill="#ffffff">Stereo</text>
  </g>

  <g transform="translate(300, 150)">
    <rect x="0" y="0" width="80" height="30" fill="#9C27B0" stroke="#4A148C" stroke-width="2" rx="3"/>
    <text x="40" y="20" font-family="Arial" font-size="9" text-anchor="middle" fill="#ffffff">SLAM</text>
  </g>

  <g transform="translate(400, 150)">
    <rect x="0" y="0" width="80" height="30" fill="#9C27B0" stroke="#4A148C" stroke-width="2" rx="3"/>
    <text x="40" y="20" font-family="Arial" font-size="9" text-anchor="middle" fill="#ffffff">Manip</text>
  </g>

  <g transform="translate(500, 150)">
    <rect x="0" y="0" width="80" height="30" fill="#9C27B0" stroke="#4A148C" stroke-width="2" rx="3"/>
    <text x="40" y="20" font-family="Arial" font-size="9" text-anchor="middle" fill="#ffffff">Nav</text>
  </g>

  <!-- Isaac Sim -->
  <g transform="translate(50, 220)">
    <rect x="0" y="0" width="600" height="50" fill="#F44336" stroke="#B71C1C" stroke-width="2" rx="5"/>
    <text x="300" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">Isaac Sim (Isaac Gym, Omniverse)</text>
  </g>

  <!-- Isaac Apps -->
  <g transform="translate(50, 300)">
    <rect x="0" y="0" width="600" height="50" fill="#8BC34A" stroke="#558B2F" stroke-width="2" rx="5"/>
    <text x="300" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">Isaac Apps (Reference Applications)</text>
  </g>

  <!-- Isaac Apps Components -->
  <g transform="translate(120, 310)">
    <rect x="0" y="0" width="70" height="30" fill="#3F51B5" stroke="#1A237E" stroke-width="2" rx="3"/>
    <text x="35" y="12" font-family="Arial" font-size="8" text-anchor="middle" fill="#ffffff">Warehouse</text>
    <text x="35" y="22" font-family="Arial" font-size="8" text-anchor="middle" fill="#ffffff">Logistics</text>
  </g>

  <g transform="translate(210, 310)">
    <rect x="0" y="0" width="70" height="30" fill="#3F51B5" stroke="#1A237E" stroke-width="2" rx="3"/>
    <text x="35" y="12" font-family="Arial" font-size="8" text-anchor="middle" fill="#ffffff">AMR</text>
    <text x="35" y="22" font-family="Arial" font-size="8" text-anchor="middle" fill="#ffffff">Navigation</text>
  </g>

  <g transform="translate(300, 310)">
    <rect x="0" y="0" width="70" height="30" fill="#3F51B5" stroke="#1A237E" stroke-width="2" rx="3"/>
    <text x="35" y="12" font-family="Arial" font-size="8" text-anchor="middle" fill="#ffffff">Pick &</text>
    <text x="35" y="22" font-family="Arial" font-size="8" text-anchor="middle" fill="#ffffff">Place</text>
  </g>

  <g transform="translate(390, 310)">
    <rect x="0" y="0" width="70" height="30" fill="#3F51B5" stroke="#1A237E" stroke-width="2" rx="3"/>
    <text x="35" y="12" font-family="Arial" font-size="8" text-anchor="middle" fill="#ffffff">Autonomous</text>
    <text x="35" y="22" font-family="Arial" font-size="8" text-anchor="middle" fill="#ffffff">Mobile</text>
  </g>

  <g transform="translate(480, 310)">
    <rect x="0" y="0" width="70" height="30" fill="#3F51B5" stroke="#1A237E" stroke-width="2" rx="3"/>
    <text x="35" y="12" font-family="Arial" font-size="8" text-anchor="middle" fill="#ffffff">Stereo</text>
    <text x="35" y="22" font-family="Arial" font-size="8" text-anchor="middle" fill="#ffffff">DNN</text>
  </g>

  <!-- Layer connections -->
  <line x1="350" y1="110" x2="350" y2="140" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="190" x2="350" y2="220" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="270" x2="350" y2="300" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>

  <!-- Labels -->
  <text x="380" y="130" font-family="Arial" font-size="10" text-anchor="start" fill="#000000">ROS Integration</text>
  <text x="380" y="210" font-family="Arial" font-size="10" text-anchor="start" fill="#000000">Simulation</text>
  <text x="380" y="290" font-family="Arial" font-size="10" text-anchor="start" fill="#000000">Applications</text>

  <!-- Legend -->
  <rect x="20" y="370" width="250" height="20" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="30" y="385" font-family="Arial" font-size="10" fill="#000000">Hardware → Isaac ROS → Isaac Sim → Isaac Apps</text>

</svg>