<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <title>ROS 2 Architecture Diagram</title>
  <desc>Diagram showing ROS 2 architecture with nodes, topics, services, and communication patterns</desc>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title -->
  <text x="300" y="30" font-family="Arial" font-size="18" text-anchor="middle" fill="#000000">ROS 2 Architecture: The Robot Nervous System</text>

  <!-- Nodes -->
  <rect x="50" y="80" width="120" height="60" fill="#4CAF50" stroke="#2E7D32" stroke-width="2" rx="5"/>
  <text x="110" y="110" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">Navigation</text>
  <text x="110" y="125" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Node</text>

  <rect x="240" y="80" width="120" height="60" fill="#2196F3" stroke="#0D47A1" stroke-width="2" rx="5"/>
  <text x="300" y="110" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">Sensor</text>
  <text x="300" y="125" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Node</text>

  <rect x="430" y="80" width="120" height="60" fill="#FF9800" stroke="#E65100" stroke-width="2" rx="5"/>
  <text x="490" y="110" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">Control</text>
  <text x="490" y="125" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">Node</text>

  <!-- Topics -->
  <ellipse cx="150" cy="200" rx="60" ry="25" fill="#F44336" stroke="#B71C1C" stroke-width="2"/>
  <text x="150" y="205" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">/cmd_vel</text>

  <ellipse cx="300" cy="200" rx="60" ry="25" fill="#F44336" stroke="#B71C1C" stroke-width="2"/>
  <text x="300" y="205" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">/laser_scan</text>

  <ellipse cx="450" cy="200" rx="60" ry="25" fill="#F44336" stroke="#B71C1C" stroke-width="2"/>
  <text x="450" y="205" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">/joint_states</text>

  <!-- Services -->
  <rect x="200" y="280" width="80" height="30" fill="#9C27B0" stroke="#4A148C" stroke-width="2" rx="3"/>
  <text x="240" y="300" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">/get_map</text>

  <rect x="340" y="280" width="80" height="30" fill="#9C27B0" stroke="#4A148C" stroke-width="2" rx="3"/>
  <text x="380" y="300" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">/set_mode</text>

  <!-- Communication Arrows -->
  <line x1="110" y1="140" x2="150" y2="175" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="140" x2="300" y2="175" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="490" y1="140" x2="450" y2="175" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <line x1="150" y1="225" x2="110" y2="280" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="225" x2="300" y2="280" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="225" x2="490" y2="280" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="20" y="330" width="180" height="60" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="30" y="345" font-family="Arial" font-size="12" fill="#000000">Legend:</text>
  <rect x="30" y="355" width="15" height="10" fill="#4CAF50" stroke="#2E7D32"/>
  <text x="50" y="365" font-family="Arial" font-size="10" fill="#000000">Nodes</text>
  <rect x="30" y="370" width="15" height="10" fill="#F44336" stroke="#B71C1C"/>
  <text x="50" y="380" font-family="Arial" font-size="10" fill="#000000">Topics</text>
  <rect x="100" y="355" width="15" height="10" fill="#9C27B0" stroke="#4A148C"/>
  <text x="120" y="365" font-family="Arial" font-size="10" fill="#000000">Services</text>
</svg>